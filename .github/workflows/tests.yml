name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-test.txt
      - name: Compile Java service
        run: ./build.ps1
      - name: Test transactions and concurrency
        run: java -cp "target/classes;target/lib/*" OperationsTest
      - name: Test real HTTP service
        run: python -m pytest tests -q
